name: Jethos Web CI

on:
  pull_request:
    paths:
      - 'jethos-web/**'
      - 'dapp-new/assets/**'
      - 'dapp-new/content/**'
      - '.github/workflows/jethos-web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'jethos-web/**'
      - 'dapp-new/assets/**'
      - 'dapp-new/content/**'

permissions:
  contents: read

concurrency:
  group: jethos-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jethos-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: jethos-web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify
      - run: npx playwright install --with-deps msedge
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jethos-web-review
          path: |
            jethos-web/dist
            jethos-web/artifacts/enterprise-final
            jethos-web/playwright-report
            jethos-web/test-results
          if-no-files-found: ignore
          retention-days: 14
