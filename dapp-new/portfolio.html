<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Composition - Jethos Protocol</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  
  <style>
    /* Video Background */
    #video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.95;
    }

    #app {
      position: relative;
      z-index: 1;
    }

    .chart-container {
      position: relative;
      height: 70vh;
      min-height: 500px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <!-- NavBar -->
  <div id="navbar-root"></div>
  <script type="module">
    import { NavBar } from './src/organisms/NavBar.js';
    const navbar = new NavBar({ activePage: 'portfolio', transparent: false });
    document.getElementById('navbar-root').appendChild(navbar.render());
  </script>

  <!-- Video Background -->
  <video id="video-background" autoplay loop muted playsinline>
    <source src="./20s slowed compolex backgound.mp4" type="video/mp4">
  </video>

  <div id="app" class="min-h-screen p-6" style="padding-top:80px">
    <div class="max-w-7xl mx-auto">
      <!-- Header -->
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-4xl font-bold text-white mb-2">
            🌊 Portfolio Composition
          </h1>
          <p class="text-white/70">Real-time pool token allocation</p>
        </div>
      </div>

      <!-- Main Chart Card -->
      <div class="glass-card rounded-2xl shadow-2xl p-8 mb-6">
        <div class="chart-container">
          <canvas id="portfolioChart"></canvas>
        </div>
      </div>

      <!-- Token Details Cards -->
      <div id="tokenDetails" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Cards will be generated dynamically -->
      </div>

      <!-- Pool Statistics -->
      <div class="glass-card rounded-2xl shadow-2xl p-6 mt-6">
        <h3 class="text-xl font-bold text-gray-800 mb-4">📊 Pool Statistics</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <p class="text-sm text-gray-600 mb-1">Total Pool Value</p>
            <p id="totalValue" class="text-2xl font-bold text-gray-900">Loading...</p>
          </div>
          <div>
            <p class="text-sm text-gray-600 mb-1">Number of Tokens</p>
            <p id="tokenCount" class="text-2xl font-bold text-gray-900">Loading...</p>
          </div>
          <div>
            <p class="text-sm text-gray-600 mb-1">Total LP Shares</p>
            <p id="totalShares" class="text-2xl font-bold text-gray-900">Loading...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/portfolio.js"></script>
</body>
</html>
