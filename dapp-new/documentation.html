<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeFi System - API Documentation</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0b1020 0%, #1a1f35 100%);
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(100, 116, 139, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(96, 165, 250, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(96, 165, 250, 0.7);
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        :root {
            color-scheme: dark;
        }

        .border-l-3 {
            border-left-width: 3px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white">
    <div id="app" class="min-h-screen">
        <div id="loading" class="flex items-center justify-center h-screen">
            <div class="text-center">
                <div class="inline-block w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-xl text-blue-400">Loading API Documentation...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { ModulesGrid } from './src/organisms/ModulesGrid.js';
        import { FunctionModal } from './src/organisms/FunctionModal.js';
        import { DocumentationStats } from './src/organisms/DocumentationStats.js';
        import { DependencyGraph } from './src/organisms/DependencyGraph.js';
        import { ApiReferenceParser } from './src/utils/MarkdownParser.js';
        import { Button } from './src/atoms/Button.js';

        class DocumentationApp {
            constructor() {
                this.modules = [];
                this.dependencies = [];
                this.stats = {};
                this.currentModal = null;
                this.dependencyGraph = null;
                this.dependenciesActive = false;
                
                this.init();
            }

            async init() {
                try {
                    await this.loadData();
                    this.render();
                } catch (error) {
                    this.showError(error.message);
                }
            }

            async loadData() {
                console.log('📥 Loading documentation data...');
                
                // Load JSON
                const jsonResponse = await fetch('api_reference.json');
                if (!jsonResponse.ok) throw new Error('Failed to load API Reference JSON');
                const jsonData = await jsonResponse.json();
                
                // Load dependencies
                try {
                    const depsResponse = await fetch('function_dependencies.json');
                    if (depsResponse.ok) {
                        const depsData = await depsResponse.json();
                        this.dependencies = depsData.dependencies || [];
                    }
                } catch (err) {
                    console.warn('Dependencies file not found, continuing without it');
                    this.dependencies = [];
                }
                
                // Parse JSON
                this.modules = ApiReferenceParser.parseApiReference(jsonData);
                this.stats = ApiReferenceParser.calculateStats(this.modules);
                
                console.log('✅ Data loaded successfully');
            }

            render() {
                const appContainer = document.getElementById('app');
                const loadingDiv = document.getElementById('loading');
                
                if (loadingDiv) {
                    loadingDiv.remove();
                }
                
                appContainer.innerHTML = '';

                // Header
                const header = this.createHeader();
                appContainer.appendChild(header);

                // Main content
                const main = document.createElement('main');
                main.className = 'pb-20';

                // Modules Grid
                const modulesGrid = new ModulesGrid({
                    modules: this.modules,
                    onFunctionClick: (func) => this.handleFunctionClick(func)
                });
                main.appendChild(modulesGrid.render());
                
                // Store reference for later use
                this.modulesGrid = modulesGrid;

                // Listen to module toggle events to refresh arrows
                if (modulesGrid.moduleCards) {
                    modulesGrid.moduleCards.forEach(moduleCard => {
                        const originalUpdate = moduleCard.update.bind(moduleCard);
                        moduleCard.update = () => {
                            originalUpdate();
                            // Refresh arrows after module toggle
                            if (this.dependencyGraph && this.dependenciesActive) {
                                setTimeout(() => {
                                    this.dependencyGraph.refreshArrows();
                                }, 350); // Wait for animation
                            }
                        };
                    });
                }

                appContainer.appendChild(main);

                // Stats Panel
                const statsPanel = new DocumentationStats({ 
                    stats: this.stats,
                    position: 'bottom-left'
                });
                appContainer.appendChild(statsPanel.render());

                // Initialize Dependency Graph
                this.dependencyGraph = new DependencyGraph({
                    dependencies: this.dependencies,
                    getColorForFunction: (funcName) => this.getColorForFunction(funcName),
                    modulesGrid: this.modulesGrid
                });

                // Controls Panel
                const controlsPanel = this.createControlsPanel();
                appContainer.appendChild(controlsPanel);

                console.log('🎨 UI rendered successfully');
            }

            createHeader() {
                const header = document.createElement('header');
                header.className = 'bg-gradient-to-r from-blue-900 via-indigo-900 to-purple-900 border-b border-gray-700 sticky top-0 z-30 backdrop-blur-lg bg-opacity-95';

                const container = document.createElement('div');
                container.className = 'container mx-auto px-6 py-4';

                const titleContainer = document.createElement('div');
                titleContainer.className = 'flex items-center justify-between';

                const leftSection = document.createElement('div');
                
                const title = document.createElement('h1');
                title.className = 'text-3xl font-bold text-white mb-1';
                title.textContent = 'DeFi System API Documentation';
                leftSection.appendChild(title);

                const subtitle = document.createElement('p');
                subtitle.className = 'text-sm text-blue-200';
                subtitle.textContent = 'Modular Architecture Reference';
                leftSection.appendChild(subtitle);

                titleContainer.appendChild(leftSection);

                const badge = document.createElement('div');
                badge.className = 'bg-green-500/20 text-green-400 px-4 py-2 rounded-full text-sm font-semibold border border-green-500/50';
                badge.textContent = 'v3.0';
                titleContainer.appendChild(badge);

                container.appendChild(titleContainer);
                header.appendChild(container);

                return header;
            }

            createControlsPanel() {
                const panel = document.createElement('div');
                panel.className = 'fixed top-6 right-6 z-40 bg-white/95 dark:bg-gray-800/95 backdrop-blur-lg rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 p-4';

                const title = document.createElement('h3');
                title.className = 'text-sm font-semibold text-gray-900 dark:text-white mb-3';
                title.textContent = 'Controls';
                panel.appendChild(title);

                const buttonsContainer = document.createElement('div');
                buttonsContainer.className = 'flex flex-col gap-2';

                // Dependencies button - Toggle visualization
                const depsBtn = new Button({
                    label: this.dependenciesActive ? '🔗 Hide Dependencies' : '🔗 Show Dependencies',
                    variant: this.dependenciesActive ? 'warning' : 'secondary',
                    size: 'sm',
                    fullWidth: true,
                    onClick: () => this.toggleDependencies()
                });
                buttonsContainer.appendChild(depsBtn.render());

                // View JSON button
                const jsonBtn = new Button({
                    label: '📄 View JSON',
                    variant: 'outline',
                    size: 'sm',
                    fullWidth: true,
                    onClick: () => {
                        window.open('function_dependencies.json', '_blank');
                    }
                });
                buttonsContainer.appendChild(jsonBtn.render());

                // Reload button
                const reloadBtn = new Button({
                    label: '🔄 Reload',
                    variant: 'outline',
                    size: 'sm',
                    fullWidth: true,
                    onClick: () => this.reload()
                });
                buttonsContainer.appendChild(reloadBtn.render());

                panel.appendChild(buttonsContainer);

                return panel;
            }

            handleFunctionClick(func) {
                // Se la modalità dependencies è attiva, mostra le frecce invece del modal
                if (this.dependenciesActive) {
                    console.log('🔗 Showing dependencies for:', func.name);
                    this.dependencyGraph.clearAll();
                    setTimeout(() => {
                        try {
                            this.dependencyGraph.showDependencies(func.name);
                        } catch (error) {
                            console.warn('Error showing dependencies:', error);
                        }
                    }, 50);
                } else {
                    // Altrimenti apri il modal normale
                    this.openFunctionModal(func);
                }
            }

            openFunctionModal(func) {
                console.log('📖 Opening function modal:', func.name);
                
                const functionDeps = this.dependencies.filter(d => 
                    d.from && d.from.includes(func.name)
                );

                if (this.currentModal) {
                    const existingModal = document.getElementById('function-modal');
                    if (existingModal) existingModal.remove();
                }

                this.currentModal = new FunctionModal({
                    func: func,
                    dependencies: functionDeps,
                    onClose: () => this.closeFunctionModal()
                });

                const modalElement = this.currentModal.render();
                modalElement.id = 'function-modal';
                document.body.appendChild(modalElement);

                setTimeout(() => {
                    this.currentModal.show();
                    const modalOverlay = document.getElementById('function-modal');
                    if (modalOverlay) {
                        modalOverlay.classList.remove('opacity-0', 'invisible');
                        modalOverlay.classList.add('opacity-100');
                        const modalContent = modalOverlay.querySelector('.transform');
                        if (modalContent) {
                            modalContent.classList.remove('scale-90');
                            modalContent.classList.add('scale-100');
                        }
                    }
                }, 10);
            }

            closeFunctionModal() {
                const modalOverlay = document.getElementById('function-modal');
                if (modalOverlay) {
                    modalOverlay.classList.remove('opacity-100');
                    modalOverlay.classList.add('opacity-0', 'invisible');
                    setTimeout(() => {
                        modalOverlay.remove();
                        this.currentModal = null;
                    }, 300);
                }
            }

            toggleDependencies() {
                if (!this.dependencyGraph) {
                    console.warn('Dependency graph not initialized');
                    return;
                }

                this.dependenciesActive = !this.dependenciesActive;

                if (this.dependenciesActive) {
                    console.log('🔗 Activating interactive dependency mode...');
                    // Just enable the mode, arrows appear on click
                } else {
                    console.log('🔗 Deactivating dependency visualization...');
                    this.dependencyGraph.clearAll();
                }

                // Update button
                this.render();
            }

            getColorForFunction(funcName) {
                // Find function in modules
                for (const module of this.modules) {
                    const func = module.functions.find(f => f.name === funcName);
                    if (func) {
                        const colorMap = {
                            'view': '#60a5fa',
                            'write': '#f59e0b',
                            'emergency': '#ef4444',
                            'external': '#8b5cf6'
                        };
                        return colorMap[func.color] || '#60a5fa';
                    }
                }
                return '#60a5fa';
            }

            async reload() {
                console.log('🔄 Reloading data...');
                const appContainer = document.getElementById('app');
                appContainer.innerHTML = '<div id="loading" class="flex items-center justify-center h-screen"><div class="text-center"><div class="inline-block w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div><p class="text-xl text-blue-400">Reloading...</p></div></div>';
                
                // Clear dependencies
                if (this.dependencyGraph) {
                    this.dependencyGraph.destroy();
                    this.dependencyGraph = null;
                }
                this.dependenciesActive = false;

                try {
                    await this.loadData();
                    this.render();
                } catch (error) {
                    this.showError(error.message);
                }
            }

            showError(message) {
                const appContainer = document.getElementById('app');
                appContainer.innerHTML = `
                    <div class="flex items-center justify-center h-screen p-8">
                        <div class="bg-red-900/50 border border-red-500 rounded-xl p-8 max-w-2xl">
                            <h2 class="text-2xl font-bold text-red-400 mb-4">❌ Error Loading Documentation</h2>
                            <p class="text-red-200 mb-4">${message}</p>
                            <button 
                                onclick="location.reload()" 
                                class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg font-semibold transition-colors"
                            >
                                🔄 Retry
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        // Initialize app
        const app = new DocumentationApp();
    </script>
</body>
</html>
