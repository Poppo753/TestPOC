<!doctype html>
<html lang="en" data-root="..">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Jethos Interactive Demo</title>
  <meta name="description" content="Experience an entirely simulated Jethos deposit, portfolio, transparency and withdrawal journey. No wallet and no real funds.">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layouts.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/demo.css">
  <script type="module" src="../assets/js/core/site-shell.js"></script>
  <script type="module" src="../assets/js/demo/controller.js"></script>
</head>
<body data-page="demo">
  <div class="page-grid"></div>
  <div data-site-header></div>

  <main id="main-content" class="demo-app">
    <div class="demo-notice" role="note">
      <strong>Interactive demo</strong>
      <span>No wallet, blockchain or real funds. Every value and operation is illustrative.</span>
    </div>

    <div class="demo-shell">
      <aside class="demo-rail" aria-label="Demo navigation">
        <div class="demo-profile">
          <span class="demo-profile__mark" aria-hidden="true">JD</span>
          <div><strong>Demo profile</strong><span>10,000 starting USDC</span></div>
        </div>
        <nav class="demo-nav">
          <a href="#overview" data-demo-route="overview">Overview</a>
          <a href="#vaults" data-demo-route="vaults">Explore vaults</a>
          <a href="#portfolio" data-demo-route="portfolio">Portfolio</a>
          <a href="#activity" data-demo-route="activity">Activity</a>
          <a href="#transparency" data-demo-route="transparency">Transparency</a>
        </nav>
        <div class="demo-rail__footer">
          <button class="button button--ghost" type="button" data-demo-reset>Reset demo</button>
          <a href="../app.html">Open technical PoC →</a>
        </div>
      </aside>

      <section class="demo-workspace" aria-live="polite">
        <h1 class="sr-only">Jethos Interactive Demo</h1>
        <div id="demo-view"></div>
      </section>
    </div>
  </main>

  <div class="modal-backdrop demo-modal-backdrop" data-demo-modal hidden>
    <section class="modal demo-modal" role="dialog" aria-modal="true" aria-labelledby="demo-modal-title">
      <button class="demo-modal__close" type="button" aria-label="Close dialog" data-demo-modal-close>×</button>
      <div id="demo-modal-content"></div>
    </section>
  </div>

  <div class="toast-region" aria-live="polite" aria-atomic="true" data-demo-toasts></div>
</body>
</html>
