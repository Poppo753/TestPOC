            padding: 0;

            background: #0b1020;
            color: #e5e7eb;
            overflow-x: auto;
        }
        #root {
            width: 100%;
            min-height: 100vh;
        }
        .function-item {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .function-item:hover {
            opacity: 0.8;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideIn {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes drawLine {
            from { stroke-dashoffset: 1000; }
            to { stroke-dashoffset: 0; }
        }
        .animate-in {
            animation: fadeIn 0.4s ease-out;
        }
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
        
        /* Documentation Modal Styles - from Old_diagram.html */
        .docs-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .docs-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .docs-popup {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border: 2px solid #60a5fa;
            border-radius: 16px;
            max-width: 90vw;
            max-height: 90vh;
            width: 800px;
            overflow: hidden;

        }
        
        .docs-overlay.active .docs-popup {
            transform: scale(1) translateY(0);
        }
        
        .docs-header {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .docs-title {
            font-size: 20px;
            font-weight: 700;
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .docs-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .docs-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        
        .docs-content {
            padding: 24px;
            max-height: 70vh;
            overflow-y: auto;
            color: #e5e7eb;
            line-height: 1.6;
        }
        
        .docs-content::-webkit-scrollbar {
            width: 8px;
        }
        
        .docs-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        
        .docs-content::-webkit-scrollbar-thumb {
            background: #60a5fa;
            border-radius: 4px;
        }
        
        .docs-signature {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 16px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 14px;
            color: #60a5fa;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        
        .docs-section {
            margin-bottom: 24px;
        }
        
        .docs-section h4 {
            color: #60a5fa;
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .docs-section p, .docs-section ul {
            margin: 0 0 12px 0;
            color: #d1d5db;
        }
        
        .docs-section ul {
            padding-left: 20px;
        }
        
        .docs-section li {
            margin-bottom: 6px;
        }
        
        .access-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;

        .access-owner { background: #fbbf24; color: #92400e; }

        .access-view { background: #60a5fa; color: #1e40af; }
        .access-public { background: #a78bfa; color: #5b21b6; }
        .access-emergency { background: #f87171; color: #991b1b; }
        
        .tooltip {
            position: fixed;
            background: rgba(15, 23, 42, 0.98);
            border: 2px solid #60a5fa;
            border-radius: 8px;
            padding: 12px 16px;
            z-index: 1000;
            max-width: 400px;

            backdrop-filter: blur(10px);

            border-radius: 12px;
            padding: 8px;
            display: inline-flex;
            gap: 8px;

            color: #60a5fa;
        }

</head>

                const isCaller = selectedFunction && viewMode === 'incoming' && reverseCallMap[selectedFunction]?.some(

        function getFunctionPosition(moduleKey, functionId) {
          const mod = modules.find(m => m.key === moduleKey);
          if (!mod) return null;
          
          const fnIdx = mod.functions.findIndex(f => f.id === functionId);
          if (fnIdx === -1) return null;
          
          const functionHeight = 20;
          const headerHeight = 50;
          const fnY = mod.y + headerHeight + fnIdx * functionHeight + 9;
          
          return {
            x: mod.x + 175,
            y: fnY
          };
        }

        function Arrow({ from, to, type, label, index = 0 }) {
          const fromPos = getFunctionPosition(from.module, from.fn);
          const toPos = getFunctionPosition(to.module, to.fn);
          
          if (!fromPos || !toPos) return null;
          
          const dx = toPos.x - fromPos.x;
          const dy = toPos.y - fromPos.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          // Offset multiplo per evitare sovrapposizioni
          const baseOffset = Math.min(distance * 0.25, 80);
          const offset = baseOffset + (index * 20);
          const perpX = -dy / distance * offset;
          const perpY = dx / distance * offset;
          
          const c1x = fromPos.x + dx * 0.3 + perpX;
          const c1y = fromPos.y + dy * 0.3 + perpY;
          const c2x = fromPos.x + dx * 0.7 + perpX;
          const c2y = fromPos.y + dy * 0.7 + perpY;
          
          const pathId = `arrow-${from.module}-${from.fn}-${to.module}-${to.fn}-${index}`;
          const midX = fromPos.x + dx * 0.5 + perpX;
          const midY = fromPos.y + dy * 0.5 + perpY;
          
          // Calcola lunghezza del path per l'animazione
          const pathLength = Math.abs(distance * 1.5);
          
          return (
            <g>
              <defs>
                <marker
                  id={`arrowhead-${type}-${index}`}
                  markerWidth="12"
                  markerHeight="12"
                  refX="12"
                  refY="6"
                  orient="auto"
                >
                  <path d="M 0 0 L 12 6 L 0 12 z" fill={type} />
                </marker>
              </defs>
              {/* Shadow per maggiore visibilità */}
              <path
                d={`M ${fromPos.x} ${fromPos.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${toPos.x} ${toPos.y}`}
                fill="none"
                stroke="#000"
                strokeWidth={6}
                opacity={0.3}
              />
              {/* Freccia principale con animazione corretta */}
              <path
                id={pathId}
                d={`M ${fromPos.x} ${fromPos.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${toPos.x} ${toPos.y}`}
                fill="none"
                stroke={type}
                strokeWidth={4}
                markerEnd={`url(#arrowhead-${type}-${index})`}
                opacity={0}
                style={{
                  strokeDasharray: pathLength,
                  strokeDashoffset: pathLength,
                  animation: `drawArrow-${index} 1s ease-out forwards`,
                  animationDelay: `${index * 0.1}s`
                }}
              />
              <style>{`
                @keyframes drawArrow-${index} {
                  0% { 
                    stroke-dashoffset: ${pathLength}; 
                    opacity: 0;
                  }
                  1% {
                    opacity: 0.95;
                  }
                  100% { 
                    stroke-dashoffset: 0; 
                    opacity: 0.95;
                  }
                }
              `}</style>
              {/* Etichetta più grande con sfondo */}
              <g style={{ 
                animation: `fadeInLabel 0.5s ease-out forwards`,
                animationDelay: `${0.8 + index * 0.1}s`,
                opacity: 0
              }}>
                <rect
                  x={midX - 60}
                  y={midY - 12}
                  width={120}
                  height={24}
                  rx={6}
                  fill={CARD}
                  stroke={type}
                  strokeWidth={2}
                  opacity={0.95}
                />
                <text 
                  x={midX} 
                  y={midY + 5} 
                  fontSize={11} 
                  fill={TEXT} 
                  fontWeight={600}
                  textAnchor="middle"
                >
                  {to.fn.length > 18 ? to.fn.substring(0, 15) + '...' : to.fn}
                </text>
              </g>
              <style>{`
                @keyframes fadeInLabel {
                  from { opacity: 0; transform: translateY(-5px); }
                  to { opacity: 1; transform: translateY(0); }
                }
              `}</style>
              {label && (
                <text 
                  x={midX} 
                  y={midY + 20} 
                  fontSize={9} 
                  fill={MUTED}
                  textAnchor="middle"
                  fontStyle="italic"
                  style={{
                    animation: `fadeInLabel 0.5s ease-out forwards`,
                    animationDelay: `${0.8 + index * 0.1}s`,
                    opacity: 0
                  }}
                >
                  ({label})
                </text>
              )}
            </g>
          );
        }

        function Diagram() {
          const [selectedFunction, setSelectedFunction] = useState(null);
          const [viewMode, setViewMode] = useState('outgoing'); // 'outgoing' or 'incoming'
          const [tooltip, setTooltip] = useState(null);
          const [showDocModal, setShowDocModal] = useState(null);
          const [docsPopup, setDocsPopup] = useState(null); // For full documentation popup
          const tooltipTimeoutRef = React.useRef(null);

          // Handle ESC key to close popup
          React.useEffect(() => {
            const handleKeyDown = (e) => {
              if (e.key === 'Escape' && docsPopup) {
                setDocsPopup(null);
              }
            };
            document.addEventListener('keydown', handleKeyDown);
            return () => document.removeEventListener('keydown', handleKeyDown);
          }, [docsPopup]);

          const getAccessType = (access) => {
            if (access.includes('owner') || access.includes('Owner')) return 'owner';
            if (access.includes('auth') || access.includes('Auth')) return 'auth';
            if (access.includes('view') || access.includes('View')) return 'view';
            if (access.includes('emergency') || access.includes('Emergency')) return 'emergency';
            if (access.includes('public')) return 'public';
            return 'view'; // default
          };

          const handleFunctionClick = (fullId) => {
            setSelectedFunction(selectedFunction === fullId ? null : fullId);
          };

          const handleFunctionHover = (fullId, event) => {
            // Cancella timeout pendenti
            if (tooltipTimeoutRef.current) {
              clearTimeout(tooltipTimeoutRef.current);
              tooltipTimeoutRef.current = null;
            }
            
            const details = functionDetails[fullId];
            if (details) {
              setTooltip({
                x: event.clientX + 15,
                y: event.clientY + 15,
                content: details,
                functionId: fullId
              });
            }
          };

          const handleFunctionLeave = () => {
            // Delay prima di nascondere
            tooltipTimeoutRef.current = setTimeout(() => {
              setTooltip(null);
            }, 200);
          };

          const handleTooltipEnter = () => {
            // Cancella il timeout quando entri nel tooltip
            if (tooltipTimeoutRef.current) {
              clearTimeout(tooltipTimeoutRef.current);
              tooltipTimeoutRef.current = null;
            }
          };

          const handleTooltipLeave = () => {
            // Nascondi immediatamente quando esci dal tooltip
            setTooltip(null);
          };

          // Calculate arrows based on current state
          let arrows = [];
          if (selectedFunction) {
            if (viewMode === 'outgoing') {
              // Cosa chiama questa funzione (originale)
              const calls = functionCalls[selectedFunction];
              if (calls && calls.length > 0) {
                const [fromModule, fromFn] = selectedFunction.split('.');
                
                arrows = calls.map((call, index) => {
                  const [toModule, ...toFnParts] = call.target.split('.');
                  const toFn = toFnParts.join('.');
                  
                  return {
                    from: { module: fromModule, fn: fromFn },
                    to: { module: toModule, fn: toFn },
                    type: call.type,
                    label: call.param || null,
                    index: index
                  };
                });
              }
            } else {
              // Chi chiama questa funzione (reverse)
              const callers = reverseCallMap[selectedFunction];
              if (callers && callers.length > 0) {
                const [toModule, toFn] = selectedFunction.split('.');
                
                arrows = callers.map((caller, index) => {
                  const [fromModule, ...fromFnParts] = caller.caller.split('.');
                  const fromFn = fromFnParts.join('.');
                  
                  return {
                    from: { module: fromModule, fn: fromFn },
                    to: { module: toModule, fn: toFn },
                    type: caller.type,
                    label: caller.param || null,
                    index: index
                  };
                });
              }
            }
          }

          return (
            <div style={{ width: "100%", minHeight: "100vh", padding: "20px", background: BG, color: TEXT, position: "relative" }}>
              <div style={{ marginBottom: "20px", maxWidth: "1300px", margin: "0 auto" }}>
                <div style={{ fontSize: "28px", fontWeight: 600, marginBottom: "8px" }}>
                  DeFi System – Detailed Function Architecture
                </div>
                <div style={{ fontSize: "14px", color: SUBT, marginBottom: "12px" }}>
                  Click on any function • Hover for details • Toggle view mode
                </div>
                
                {/* Mode Toggle */}
                <div className="mode-toggle" style={{ marginBottom: "15px" }}>
                  <button 
                    className={`mode-button ${viewMode === 'outgoing' ? 'active' : ''}`}
                    onClick={() => setViewMode('outgoing')}
                  >
                    📤 Outgoing Calls
                  </button>
                  <button 
                    className={`mode-button ${viewMode === 'incoming' ? 'active' : ''}`}
                    onClick={() => setViewMode('incoming')}
                  >
                    📥 Incoming Calls
                  </button>
                  <div style={{ fontSize: "12px", color: MUTED, padding: "10px 15px", alignSelf: "center" }}>
                    {viewMode === 'outgoing' ? 'What does this function call?' : 'Who calls this function?'}
                  </div>
                </div>
                {selectedFunction && (
                  <div className="animate-in" style={{ 
                    fontSize: "16px", 
                    color: HIGHLIGHT, 
                    padding: "15px 20px", 
                    background: "rgba(96, 165, 250, 0.15)",
                    borderRadius: "10px",
                    border: `2px solid ${HIGHLIGHT}`,
                    cursor: "pointer",
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center"
                  }} onClick={() => setSelectedFunction(null)}>
                    <div>
                      <strong style={{ fontSize: "18px" }}>{selectedFunction}</strong>
                      <div style={{ fontSize: "13px", marginTop: "5px", color: SUBT }}>
                        {viewMode === 'outgoing' ? (
                          <>
                            {(functionCalls[selectedFunction]?.length || 0) > 0 ? (
                              <>
                                Calls {functionCalls[selectedFunction].length} function(s)
                                {" → " + functionCalls[selectedFunction].map(c => {
                                  const parts = c.target.split('.');
                                  return parts[parts.length - 1];
                                }).join(', ')}
                              </>
                            ) : (
                              <span style={{ color: '#f59e0b' }}>⚠️ This function doesn't call any other functions (or not mapped yet)</span>
                            )}
                          </>
                        ) : (
                          <>
                            {(reverseCallMap[selectedFunction]?.length || 0) > 0 ? (
                              <>
                                Called by {reverseCallMap[selectedFunction].length} function(s)
                                {" ← " + reverseCallMap[selectedFunction].map(c => {
                                  const parts = c.caller.split('.');
                                  return parts[parts.length - 1];
                                }).join(', ')}
                              </>
                            ) : (
                              <span style={{ color: '#f59e0b' }}>⚠️ No functions call this one (or not mapped yet)</span>
                            )}
                          </>
                        )}
                      </div>
                    </div>
                    <div style={{ fontSize: "24px", fontWeight: "bold" }}>✕</div>
                  </div>
                )}
              </div>

              <svg width={1300} height={1400} style={{ display: "block", margin: "0 auto" }}>
                {/* Draw modules first */}
                {modules.map(mod => (
                  <ModuleCard 
                    key={mod.key} 
                    mod={mod} 
                    selectedFunction={selectedFunction}
                    viewMode={viewMode}
                    onFunctionClick={handleFunctionClick}
                    onFunctionHover={handleFunctionHover}
                    onFunctionLeave={handleFunctionLeave}
                  />
                ))}
                
                {/* Draw arrows on top for visibility */}
                {arrows.map((arrow, idx) => (
                  <Arrow key={idx} {...arrow} />
                ))}
                
                {/* Legend - moved down and improved */}
                <g transform="translate(50, 1200)">
                  <rect x={0} y={0} width={1200} height={90} rx={10} fill={CARD} stroke={BORDER} strokeWidth={2} />
                  <text x={20} y={30} fontSize={16} fill={TEXT} fontWeight={600}>Legend & Instructions</text>
                  
                  <circle cx={20} cy={55} r={6} fill={READ} />
                  <text x={35} y={60} fontSize={12} fill={SUBT}>Read/View calls</text>
                  
                  <circle cx={170} cy={55} r={6} fill={WRITE} />
                  <text x={185} y={60} fontSize={12} fill={SUBT}>Write/State changes</text>
                  
                  <circle cx={360} cy={55} r={6} fill={EXTERNAL} />
                  <text x={375} y={60} fontSize={12} fill={SUBT}>External integrations</text>
                  
                  <circle cx={560} cy={55} r={6} fill={EMERGENCY} />
                  <text x={575} y={60} fontSize={12} fill={SUBT}>Emergency operations</text>
                  
                  <text x={20} y={80} fontSize={11} fill={HIGHLIGHT} fontWeight={500}>
                    💡 Click any function to see what it calls → Arrows show exact function-to-function connections
                  </text>
                </g>
              </svg>

              {/* Tooltip */}
              {tooltip && (
                <div 
                  className="tooltip slide-in"
                  style={{
                    left: tooltip.x + 'px',
                    top: tooltip.y + 'px'
                  }}
                  onMouseEnter={handleTooltipEnter}
                  onMouseLeave={handleTooltipLeave}
                >
                  <div style={{ fontSize: "14px", fontWeight: 600, color: HIGHLIGHT, marginBottom: "8px" }}>
                    {tooltip.content.signature}
                  </div>
                  <div style={{ fontSize: "11px", color: SUBT, marginBottom: "4px" }}>
                    <strong>Access:</strong> {tooltip.content.access}
                  </div>
                  <div style={{ fontSize: "11px", color: SUBT, marginBottom: "4px" }}>
                    <strong>Parameters:</strong> {tooltip.content.params}
                  </div>
                  <div style={{ fontSize: "11px", color: SUBT, marginBottom: "4px" }}>
                    <strong>Returns:</strong> {tooltip.content.returns}
                  </div>
                  <div style={{ fontSize: "11px", color: TEXT, marginTop: "8px", borderTop: "1px solid #334155", paddingTop: "8px" }}>
                    {tooltip.content.description}
                  </div>
                  {tooltip.content.docs && (
                    <div style={{ marginTop: "10px", paddingTop: "8px", borderTop: "1px solid #334155" }}>
                      <button 
                        onClick={(e) => {
                          e.preventDefault();
                          e.stopPropagation();
                          setDocsPopup({
                            functionId: tooltip.functionId,
                            basicDetails: tooltip.content
                          });
                        }}
                        style={{ 
                          background: "none",
                          border: "none",
                          color: HIGHLIGHT, 
                          fontSize: "11px", 
                          textDecoration: "none",
                          display: "flex",
                          alignItems: "center",
                          gap: "5px",
                          cursor: "pointer",
                          padding: 0
                        }}
                      >
                        📄 View Documentation →
                      </button>
                    </div>
                  )}
                </div>
              )}
              
              {/* Beautiful Documentation Modal - from Old_diagram.html */}
              {docsPopup && (
                <div 
                  className={`docs-overlay ${docsPopup ? 'active' : ''}`}
                  onClick={(e) => {
                    if (e.target === e.currentTarget) {
                      setDocsPopup(null);
                    }
                  }}
                >
                  <div className="docs-popup">
                    <div className="docs-header">
                      <h3 className="docs-title">
                        🔧 {docsPopup.basicDetails?.signature || docsPopup.functionId}
                        {docsPopup.basicDetails && (
                          <span className={`access-badge access-${getAccessType(docsPopup.basicDetails.access)}`}>
                            {docsPopup.basicDetails.access}
                          </span>
                        )}
                      </h3>
                      <button 
                        className="docs-close"
                        onClick={() => setDocsPopup(null)}
                      >
                        ✕
                      </button>
                    </div>
                    <div className="docs-content">
                      {docsPopup.basicDetails && (
                        <>
                          <div className="docs-signature">
                            {docsPopup.basicDetails.signature}
                          </div>
                          
                          {docsPopup.basicDetails.description && (
                            <div className="docs-section">
                              <h4>📝 Description</h4>
                              <p>{docsPopup.basicDetails.description}</p>
                            </div>
                          )}
                          
                          {docsPopup.basicDetails.params && (
                            <div className="docs-section">
                              <h4>📋 Parameters</h4>
                              <p>{docsPopup.basicDetails.params}</p>
                            </div>
                          )}
                          
                          {docsPopup.basicDetails.returns && (
                            <div className="docs-section">
                              <h4>↩️ Returns</h4>
                              <p>{docsPopup.basicDetails.returns}</p>
                            </div>
                          )}
                          
                          {docsPopup.basicDetails.access && (
                            <div className="docs-section">
                              <h4>� Access Control</h4>
                              <p><strong>{docsPopup.basicDetails.access}</strong> - Anyone can call this function</p>
                            </div>
                          )}
                          
                          {docsPopup.basicDetails.docs && (
                            <div className="docs-section">
                              <h4>� Documentation Link</h4>
                              <p style={{ fontSize: '13px', color: '#cbd5e1', marginBottom: '12px' }}>
                                For detailed implementation notes, usage examples, and parameter descriptions, 
                                refer to the complete API documentation.
                              </p>
                              <a 
                                href={docsPopup.basicDetails.docs} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                style={{
                                  color: '#60a5fa',
                                  textDecoration: 'none',
                                  fontSize: '14px',
                                  display: 'inline-block',
                                  padding: '8px 16px',
                                  background: 'rgba(96, 165, 250, 0.1)',
                                  border: '1px solid #60a5fa',
                                  borderRadius: '6px',
                                  transition: 'all 0.2s ease'
                                }}
                                onMouseEnter={(e) => {
                                  e.target.style.background = 'rgba(96, 165, 250, 0.2)';
                                }}
                                onMouseLeave={(e) => {
                                  e.target.style.background = 'rgba(96, 165, 250, 0.1)';
                                }}
                              >
                                🔗 Open Full Documentation
                              </a>
                            </div>
                          )}
                        </>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Diagram />);
    </script>
</body>
</html>
